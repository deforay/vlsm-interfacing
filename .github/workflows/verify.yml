name: Verify

on:
  pull_request:
  push:
    branches: [master]
  # Lets the release pipeline run these exact checks before it builds anything,
  # instead of keeping a second copy of them in build-all.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Also part of `npm run verify` below, so it runs locally too. Repeated here
      # as its own step because it costs milliseconds and a failure is a design
      # decision to discuss, not a broken build -- worth surfacing under its own
      # name rather than buried in the tail of a lint/test/build log.
      - name: Check Electron safety invariants
        run: npm run check:safety

      - name: Verify application
        run: npm run verify
