site_name: InteLIS Interfacing
site_description: Receives test results from laboratory analyzers and hands them to a laboratory information system.
site_url: https://deforay.github.io/intelis-interfacing/
repo_url: https://github.com/deforay/intelis-interfacing
repo_name: deforay/intelis-interfacing
edit_uri: edit/master/docs/
copyright: Free and open-source under the GNU Affero General Public License v3.0

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    # Top tabs (Home, User guide, Technical guide) keep each sidebar to one
    # audience. Section index pages open from the section name itself.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # The site follows the reader's system setting, with a manual override.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Material ships the icon sets; without this the :material-...: shortcodes
  # render as their own text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

plugins:
  - search:
      # Split words on underscores, hyphens, dots and camelCase too, so a
      # search for "sync" finds lims_sync_status and "port" finds hostPort.
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# A link that does not resolve is a broken instruction in a document someone is
# following at a bench, so the build fails on one rather than shipping it.
strict: true
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    # A link to a heading that no longer exists fails the build too.
    anchors: warn
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Install: guide/install.md
      - Settings: guide/settings.md
      - Console: guide/console.md
      - Raw data and recovery: guide/raw-data.md
      - Backup and restore: guide/backup-restore.md
      - Troubleshooting: guide/troubleshooting.md
  - Technical guide:
      - technical/index.md
      - Architecture: technical/architecture.md
      - Protocols: technical/protocols.md
      - Analyzers: technical/analyzers.md
      - Storage: technical/storage.md
      - Result webhook: technical/result-webhook.md
      - Usage statistics: technical/telemetry.md
      - Building and releasing: technical/building.md
